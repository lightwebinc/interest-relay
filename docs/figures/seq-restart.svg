<svg xmlns="http://www.w3.org/2000/svg" width="800" height="496" viewBox="0 0 800 496" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="A relay restart: the edge keeps delivering while the relay learns its set again">
<title>A relay restart: the edge keeps delivering while the relay learns its set again</title>
<rect x="0.5" y="0.5" width="799" height="495" rx="8" fill="#000000" stroke="#2a3038"/>
<path d="M130.0,46.0 L130.0,452.0" fill="none" stroke="#3a424d" stroke-width="1.20" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M400.0,46.0 L400.0,452.0" fill="none" stroke="#3a424d" stroke-width="1.20" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M670.0,46.0 L670.0,452.0" fill="none" stroke="#3a424d" stroke-width="1.20" stroke-linejoin="round" stroke-linecap="butt"/>
<rect x="66.0" y="14.0" width="128.0" height="32.0" rx="5.0" fill="#000000" stroke="#f2f5f8" stroke-width="1.10"/>
<text x="130.0" y="34.0" font-size="11.0" fill="#f2f5f8" text-anchor="middle" font-weight="bold">hosts</text>
<rect x="336.0" y="14.0" width="128.0" height="32.0" rx="5.0" fill="#000000" stroke="#f2f5f8" stroke-width="1.10"/>
<text x="400.0" y="34.0" font-size="11.0" fill="#f2f5f8" text-anchor="middle" font-weight="bold">relay</text>
<rect x="606.0" y="14.0" width="128.0" height="32.0" rx="5.0" fill="#000000" stroke="#f2f5f8" stroke-width="1.10"/>
<text x="670.0" y="34.0" font-size="11.0" fill="#f2f5f8" text-anchor="middle" font-weight="bold">delivery edge</text>
<rect x="326.1" y="62.0" width="147.7" height="24.0" rx="4.0" fill="#1d232b" stroke="#3a424d" stroke-width="1.00"/>
<text x="400.0" y="78.0" font-size="10.5" fill="#f2f5f8" text-anchor="middle">restarts, and holds nothing</text>
<text x="535.0" y="108.0" font-size="10.5" fill="#f2f5f8" text-anchor="middle">DIGEST (a probe: compares and removes nothing)</text>
<path d="M400.0,114.0 L663.0,114.0" fill="none" stroke="#ff9a45" stroke-width="1.60" stroke-linejoin="round" stroke-linecap="butt"/>
<polygon points="670.0,114.0 662.0,117.4 662.0,110.6" fill="#ff9a45"/>
<text x="535.0" y="142.0" font-size="10.5" fill="#c3ccd6" text-anchor="middle">ACK: the groups delivered</text>
<path d="M670.0,148.0 L407.0,148.0" fill="none" stroke="#c3ccd6" stroke-width="1.30" stroke-linejoin="round" stroke-linecap="butt" stroke-dasharray="5,4"/>
<polygon points="400.0,148.0 408.0,144.6 408.0,151.4" fill="#c3ccd6"/>
<rect x="564.9" y="166.0" width="210.2" height="24.0" rx="4.0" fill="#1d232b" stroke="#3a424d" stroke-width="1.00"/>
<text x="670.0" y="182.0" font-size="10.5" fill="#f2f5f8" text-anchor="middle">keeps what the previous run announced</text>
<text x="265.0" y="212.0" font-size="10.5" fill="#f2f5f8" text-anchor="middle">DIGEST (the next refresh, within 100 s)</text>
<path d="M130.0,218.0 L393.0,218.0" fill="none" stroke="#ff9a45" stroke-width="1.60" stroke-linejoin="round" stroke-linecap="butt"/>
<polygon points="400.0,218.0 392.0,221.4 392.0,214.6" fill="#ff9a45"/>
<text x="265.0" y="246.0" font-size="10.5" fill="#c3ccd6" text-anchor="middle">ACK: a new token: the relay holds nothing</text>
<path d="M400.0,252.0 L137.0,252.0" fill="none" stroke="#c3ccd6" stroke-width="1.30" stroke-linejoin="round" stroke-linecap="butt" stroke-dasharray="5,4"/>
<polygon points="130.0,252.0 138.0,248.6 138.0,255.4" fill="#c3ccd6"/>
<text x="265.0" y="280.0" font-size="10.5" fill="#f2f5f8" text-anchor="middle">ANNOUNCE (the whole set, replayed)</text>
<path d="M130.0,286.0 L393.0,286.0" fill="none" stroke="#ff9a45" stroke-width="1.60" stroke-linejoin="round" stroke-linecap="butt"/>
<polygon points="400.0,286.0 392.0,289.4 392.0,282.6" fill="#ff9a45"/>
<text x="535.0" y="314.0" font-size="10.5" fill="#f2f5f8" text-anchor="middle">ANNOUNCE (the union, as it is learned)</text>
<path d="M400.0,320.0 L663.0,320.0" fill="none" stroke="#ff9a45" stroke-width="1.60" stroke-linejoin="round" stroke-linecap="butt"/>
<polygon points="670.0,320.0 662.0,323.4 662.0,316.6" fill="#ff9a45"/>
<rect x="329.1" y="338.0" width="141.9" height="24.0" rx="4.0" fill="#1d232b" stroke="#3a424d" stroke-width="1.00"/>
<text x="400.0" y="354.0" font-size="10.5" fill="#f2f5f8" text-anchor="middle">-restart-hold ends (105 s)</text>
<text x="535.0" y="384.0" font-size="10.5" fill="#f2f5f8" text-anchor="middle">DIGEST of the union</text>
<path d="M400.0,390.0 L663.0,390.0" fill="none" stroke="#ff9a45" stroke-width="1.60" stroke-linejoin="round" stroke-linecap="butt"/>
<polygon points="670.0,390.0 662.0,393.4 662.0,386.6" fill="#ff9a45"/>
<text x="535.0" y="418.0" font-size="10.5" fill="#c3ccd6" text-anchor="middle">ACK: what was not announced again is removed</text>
<path d="M670.0,424.0 L407.0,424.0" fill="none" stroke="#c3ccd6" stroke-width="1.30" stroke-linejoin="round" stroke-linecap="butt" stroke-dasharray="5,4"/>
<polygon points="400.0,424.0 408.0,420.6 408.0,427.4" fill="#c3ccd6"/>
<path d="M14.0,480.0 L41.0,480.0" fill="none" stroke="#ff9a45" stroke-width="1.80" stroke-linejoin="round" stroke-linecap="butt"/>
<polygon points="48.0,480.0 40.0,483.4 40.0,476.6" fill="#ff9a45"/>
<text x="56.0" y="483.8" font-size="10.5" fill="#aab4c0" text-anchor="start">from the sender: ANNOUNCE, DIGEST</text>
<path d="M265.8,480.0 L292.8,480.0" fill="none" stroke="#c3ccd6" stroke-width="1.80" stroke-linejoin="round" stroke-linecap="butt" stroke-dasharray="5,4"/>
<polygon points="299.8,480.0 291.8,483.4 291.8,476.6" fill="#c3ccd6"/>
<text x="307.8" y="483.8" font-size="10.5" fill="#aab4c0" text-anchor="start">from the receiver: ACK, RESYNC</text>
</svg>
