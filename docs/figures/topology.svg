<text x="756.0" y="194.0" font-size="10.5" fill="#56606e" text-anchor="middle">interest</text>
<text x="275.0" y="274.0" font-size="10.5" fill="#56606e" text-anchor="middle">Each host and relay is given the address of the hop above it, in the manner of a default route.</text>
