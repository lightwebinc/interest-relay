<svg xmlns="http://www.w3.org/2000/svg" width="800" height="324" viewBox="0 0 800 324" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Soft state: a digest refreshes the whole set, and a silent host's topics lapse">
<title>Soft state: a digest refreshes the whole set, and a silent host's topics lapse</title>
<rect x="0.5" y="0.5" width="799" height="323" rx="8" fill="#000000" stroke="#2a3038"/>
<path d="M200.0,46.0 L200.0,280.0" fill="none" stroke="#3a424d" stroke-width="1.20" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M600.0,46.0 L600.0,280.0" fill="none" stroke="#3a424d" stroke-width="1.20" stroke-linejoin="round" stroke-linecap="butt"/>
<rect x="96.0" y="98.0" width="608.0" height="90.0" rx="4.0" fill="none" stroke="#808a97" stroke-width="1.00" stroke-dasharray="4,3"/>
<text x="104.0" y="112.0" font-size="10.0" fill="#aab4c0" text-anchor="start" font-weight="bold">every 100 s</text>
<rect x="136.0" y="14.0" width="128.0" height="32.0" rx="5.0" fill="#000000" stroke="#f2f5f8" stroke-width="1.10"/>
<text x="200.0" y="34.0" font-size="11.0" fill="#f2f5f8" text-anchor="middle" font-weight="bold">host</text>
<rect x="536.0" y="14.0" width="128.0" height="32.0" rx="5.0" fill="#000000" stroke="#f2f5f8" stroke-width="1.10"/>
<text x="600.0" y="34.0" font-size="11.0" fill="#f2f5f8" text-anchor="middle" font-weight="bold">relay</text>
<rect x="170.0" y="62.0" width="460.0" height="24.0" rx="4.0" fill="#1d232b" stroke="#3a424d" stroke-width="1.00"/>
<text x="400.0" y="78.0" font-size="10.5" fill="#f2f5f8" text-anchor="middle">granted a lifetime of 300 s</text>
<text x="400.0" y="128.0" font-size="10.5" fill="#f2f5f8" text-anchor="middle">DIGEST of the whole set</text>
<path d="M200.0,134.0 L593.0,134.0" fill="none" stroke="#ff9a45" stroke-width="1.60" stroke-linejoin="round" stroke-linecap="butt"/>
<polygon points="600.0,134.0 592.0,137.4 592.0,130.6" fill="#ff9a45"/>
<text x="400.0" y="162.0" font-size="10.5" fill="#c3ccd6" text-anchor="middle">ACK: matched, every topic refreshed</text>
<path d="M600.0,168.0 L207.0,168.0" fill="none" stroke="#c3ccd6" stroke-width="1.30" stroke-linejoin="round" stroke-linecap="butt" stroke-dasharray="5,4"/>
<polygon points="200.0,168.0 208.0,164.6 208.0,171.4" fill="#c3ccd6"/>
<rect x="158.2" y="198.0" width="83.5" height="24.0" rx="4.0" fill="#1d232b" stroke="#3a424d" stroke-width="1.00"/>
<text x="200.0" y="214.0" font-size="10.5" fill="#f2f5f8" text-anchor="middle">the host dies</text>
<rect x="434.8" y="234.0" width="330.4" height="24.0" rx="4.0" fill="#1d232b" stroke="#3a424d" stroke-width="1.00"/>
<text x="600.0" y="250.0" font-size="10.5" fill="#f2f5f8" text-anchor="middle">300 s after the last refresh: the topics lapse, and the union shrinks</text>
<path d="M14.0,308.0 L41.0,308.0" fill="none" stroke="#ff9a45" stroke-width="1.80" stroke-linejoin="round" stroke-linecap="butt"/>
<polygon points="48.0,308.0 40.0,311.4 40.0,304.6" fill="#ff9a45"/>
<text x="56.0" y="311.8" font-size="10.5" fill="#aab4c0" text-anchor="start">from the sender: ANNOUNCE, DIGEST</text>
<path d="M265.8,308.0 L292.8,308.0" fill="none" stroke="#c3ccd6" stroke-width="1.80" stroke-linejoin="round" stroke-linecap="butt" stroke-dasharray="5,4"/>
<polygon points="299.8,308.0 291.8,311.4 291.8,304.6" fill="#c3ccd6"/>
<text x="307.8" y="311.8" font-size="10.5" fill="#aab4c0" text-anchor="start">from the receiver: ACK, RESYNC</text>
</svg>
