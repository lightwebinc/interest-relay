<svg xmlns="http://www.w3.org/2000/svg" width="800" height="642" viewBox="0 0 800 642" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="What crosses each link when the relay carries interest only, when it distributes, and when it is the publish point">
<title>What crosses each link when the relay carries interest only, when it distributes, and when it is the publish point</title>
<rect x="0.5" y="0.5" width="799" height="641" rx="8" fill="#ffffff" stroke="#e2e6e8"/>
<text x="80.0" y="20.0" font-size="9.5" fill="#56606e" text-anchor="middle" font-weight="bold" letter-spacing="0.60">HOSTS</text>
<text x="400.0" y="20.0" font-size="9.5" fill="#56606e" text-anchor="middle" font-weight="bold" letter-spacing="0.60">RELAY</text>
<text x="715.0" y="20.0" font-size="9.5" fill="#56606e" text-anchor="middle" font-weight="bold" letter-spacing="0.60">EDGE</text>
<text x="14.0" y="44.0" font-size="12.5" fill="#1b2430" text-anchor="start" font-weight="bold">Interest only (the default)</text>
<text x="14.0" y="60.0" font-size="10.5" fill="#56606e" text-anchor="start">The relay carries no objects. The consumer's lane ends where it is provisioned, as it does without a relay.</text>
<rect x="20.0" y="88.0" width="120.0" height="34.0" rx="5.0" fill="#ffffff" stroke="#1b2430" stroke-width="1.20"/>
<text x="80.0" y="109.2" font-size="12.0" fill="#1b2430" text-anchor="middle" font-weight="bold">host h1</text>
<rect x="20.0" y="152.0" width="120.0" height="34.0" rx="5.0" fill="#ffffff" stroke="#1b2430" stroke-width="1.20"/>
<text x="80.0" y="173.2" font-size="12.0" fill="#1b2430" text-anchor="middle" font-weight="bold">host h2</text>
<rect x="330.0" y="88.0" width="140.0" height="98.0" rx="5.0" fill="#ffffff" stroke="#1b2430" stroke-width="1.20"/>
<text x="400.0" y="134.5" font-size="12.0" fill="#1b2430" text-anchor="middle" font-weight="bold">relay</text>
<text x="400.0" y="148.5" font-size="10.5" fill="#56606e" text-anchor="middle">interest only</text>
<rect x="650.0" y="88.0" width="130.0" height="98.0" rx="5.0" fill="#ffffff" stroke="#1b2430" stroke-width="1.20"/>
<text x="715.0" y="134.5" font-size="12.0" fill="#1b2430" text-anchor="middle" font-weight="bold">delivery edge</text>
<text x="715.0" y="148.5" font-size="10.5" fill="#56606e" text-anchor="middle">ends interest</text>
<path d="M140.0,105.0 L323.0,105.0" fill="none" stroke="#c2570f" stroke-width="1.80" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="1.5,3.5"/>
<polygon points="330.0,105.0 322.0,108.4 322.0,101.6" fill="#c2570f"/>
<path d="M140.0,169.0 L323.0,169.0" fill="none" stroke="#c2570f" stroke-width="1.80" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="1.5,3.5"/>
<polygon points="330.0,169.0 322.0,172.4 322.0,165.6" fill="#c2570f"/>
<path d="M470.0,118.0 L643.0,118.0" fill="none" stroke="#c2570f" stroke-width="1.80" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="1.5,3.5"/>
<polygon points="650.0,118.0 642.0,121.4 642.0,114.6" fill="#c2570f"/>
<text x="235.0" y="98.0" font-size="10.5" fill="#56606e" text-anchor="middle">interest: ANNOUNCE, DIGEST</text>
<text x="235.0" y="119.0" font-size="10.5" fill="#56606e" text-anchor="middle">answers: ACK, RESYNC</text>
<text x="560.0" y="111.0" font-size="10.5" fill="#56606e" text-anchor="middle">the union, as one sender</text>
<path d="M715.0,186.0 L715.0,208.0 L80.0,208.0 L80.0,193.0" fill="none" stroke="#1f5fa8" stroke-width="1.80" stroke-linejoin="round" stroke-linecap="butt"/>
<polygon points="80.0,186.0 83.4,194.0 76.6,194.0" fill="#1f5fa8"/>
<text x="400.0" y="222.0" font-size="10.5" fill="#56606e" text-anchor="middle">the consumer's lane: the edge dials the provisioned address, here h2</text>
<text x="14.0" y="252.0" font-size="12.5" fill="#1b2430" text-anchor="start" font-weight="bold">Distribution (-distribute-listen)</text>
<text x="14.0" y="268.0" font-size="10.5" fill="#56606e" text-anchor="start">The relay ends the lane and sends each record on to the hosts that asked for its topic at a delivery address.</text>
<rect x="20.0" y="296.0" width="120.0" height="34.0" rx="5.0" fill="#ffffff" stroke="#1b2430" stroke-width="1.20"/>
<text x="80.0" y="317.2" font-size="12.0" fill="#1b2430" text-anchor="middle" font-weight="bold">host h1</text>
<rect x="20.0" y="360.0" width="120.0" height="34.0" rx="5.0" fill="#ffffff" stroke="#1b2430" stroke-width="1.20"/>
<text x="80.0" y="381.2" font-size="12.0" fill="#1b2430" text-anchor="middle" font-weight="bold">host h2</text>
<rect x="330.0" y="296.0" width="140.0" height="98.0" rx="5.0" fill="#ffffff" stroke="#1b2430" stroke-width="1.20"/>
<text x="400.0" y="342.5" font-size="12.0" fill="#1b2430" text-anchor="middle" font-weight="bold">relay</text>
<text x="400.0" y="356.5" font-size="10.5" fill="#56606e" text-anchor="middle">distributor</text>
<rect x="650.0" y="296.0" width="130.0" height="98.0" rx="5.0" fill="#ffffff" stroke="#1b2430" stroke-width="1.20"/>
<text x="715.0" y="342.5" font-size="12.0" fill="#1b2430" text-anchor="middle" font-weight="bold">delivery edge</text>
<text x="715.0" y="356.5" font-size="10.5" fill="#56606e" text-anchor="middle">delivers as provisioned</text>
<path d="M140.0,306.0 L323.0,306.0" fill="none" stroke="#c2570f" stroke-width="1.80" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="1.5,3.5"/>
<polygon points="330.0,306.0 322.0,309.4 322.0,302.6" fill="#c2570f"/>
<path d="M330.0,320.0 L147.0,320.0" fill="none" stroke="#1f5fa8" stroke-width="1.80" stroke-linejoin="round" stroke-linecap="butt"/>
<polygon points="140.0,320.0 148.0,316.6 148.0,323.4" fill="#1f5fa8"/>
<path d="M140.0,370.0 L323.0,370.0" fill="none" stroke="#c2570f" stroke-width="1.80" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="1.5,3.5"/>
<polygon points="330.0,370.0 322.0,373.4 322.0,366.6" fill="#c2570f"/>
<path d="M330.0,384.0 L147.0,384.0" fill="none" stroke="#1f5fa8" stroke-width="1.80" stroke-linejoin="round" stroke-linecap="butt"/>
<polygon points="140.0,384.0 148.0,380.6 148.0,387.4" fill="#1f5fa8"/>
<text x="235.0" y="299.0" font-size="10.5" fill="#56606e" text-anchor="middle">interest + h1's lane address</text>
<text x="235.0" y="335.0" font-size="10.5" fill="#56606e" text-anchor="middle">h1's topics: the relay dials h1</text>
<text x="235.0" y="363.0" font-size="10.5" fill="#56606e" text-anchor="middle">interest + h2's lane address</text>
<text x="235.0" y="399.0" font-size="10.5" fill="#56606e" text-anchor="middle">h2's topics: the relay dials h2</text>
<path d="M470.0,326.0 L643.0,326.0" fill="none" stroke="#c2570f" stroke-width="1.80" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="1.5,3.5"/>
<polygon points="650.0,326.0 642.0,329.4 642.0,322.6" fill="#c2570f"/>
<path d="M650.0,364.0 L477.0,364.0" fill="none" stroke="#1f5fa8" stroke-width="1.80" stroke-linejoin="round" stroke-linecap="butt"/>
<polygon points="470.0,364.0 478.0,360.6 478.0,367.4" fill="#1f5fa8"/>
<text x="560.0" y="319.0" font-size="10.5" fill="#56606e" text-anchor="middle">the union + the relay's lane</text>
<text x="560.0" y="379.0" font-size="10.5" fill="#56606e" text-anchor="middle">the consumer's lane:</text>
<text x="560.0" y="392.0" font-size="10.5" fill="#56606e" text-anchor="middle">the edge dials the relay</text>
<text x="14.0" y="426.0" font-size="12.5" fill="#1b2430" text-anchor="start" font-weight="bold">Publishing (-publish-listen, with distribution)</text>
<text x="14.0" y="442.0" font-size="10.5" fill="#56606e" text-anchor="start">Hosts publish to the relay. It publishes for them from the consumer's own address and copies to their siblings.</text>
<rect x="20.0" y="470.0" width="120.0" height="34.0" rx="5.0" fill="#ffffff" stroke="#1b2430" stroke-width="1.20"/>
<text x="80.0" y="491.2" font-size="12.0" fill="#1b2430" text-anchor="middle" font-weight="bold">host h1</text>
<rect x="20.0" y="534.0" width="120.0" height="34.0" rx="5.0" fill="#ffffff" stroke="#1b2430" stroke-width="1.20"/>
<text x="80.0" y="555.2" font-size="12.0" fill="#1b2430" text-anchor="middle" font-weight="bold">host h2</text>
<rect x="330.0" y="470.0" width="140.0" height="98.0" rx="5.0" fill="#ffffff" stroke="#1b2430" stroke-width="1.20"/>
<text x="400.0" y="516.5" font-size="12.0" fill="#1b2430" text-anchor="middle" font-weight="bold">relay</text>
<text x="400.0" y="530.5" font-size="10.5" fill="#56606e" text-anchor="middle">publish point</text>
<rect x="650.0" y="470.0" width="130.0" height="98.0" rx="5.0" fill="#ffffff" stroke="#1b2430" stroke-width="1.20"/>
<text x="715.0" y="516.5" font-size="12.0" fill="#1b2430" text-anchor="middle" font-weight="bold">delivery edge</text>
<text x="715.0" y="530.5" font-size="10.5" fill="#56606e" text-anchor="middle">to all other consumers</text>
<path d="M140.0,487.0 L323.0,487.0" fill="none" stroke="#14866d" stroke-width="1.80" stroke-linejoin="round" stroke-linecap="butt"/>
<polygon points="330.0,487.0 322.0,490.4 322.0,483.6" fill="#14866d"/>
<path d="M470.0,500.0 L643.0,500.0" fill="none" stroke="#14866d" stroke-width="1.80" stroke-linejoin="round" stroke-linecap="butt"/>
<polygon points="650.0,500.0 642.0,503.4 642.0,496.6" fill="#14866d"/>
<path d="M330.0,551.0 L147.0,551.0" fill="none" stroke="#1f5fa8" stroke-width="1.80" stroke-linejoin="round" stroke-linecap="butt"/>
<polygon points="140.0,551.0 148.0,547.6 148.0,554.4" fill="#1f5fa8"/>
<text x="235.0" y="480.0" font-size="10.5" fill="#56606e" text-anchor="middle">h1 publishes: h1 dials the relay</text>
<text x="235.0" y="544.0" font-size="10.5" fill="#56606e" text-anchor="middle">copy at once: a delivery record</text>
<text x="235.0" y="565.0" font-size="10.5" fill="#56606e" text-anchor="middle">never back to h1</text>
<text x="560.0" y="493.0" font-size="10.5" fill="#56606e" text-anchor="middle">up the tunnel: the relay dials</text>
<text x="560.0" y="514.0" font-size="10.5" fill="#56606e" text-anchor="middle">from the consumer's address</text>
<path d="M650.0,538.0 L477.0,538.0" fill="none" stroke="#8a93a0" stroke-width="1.80" stroke-linejoin="round" stroke-linecap="butt" stroke-dasharray="5,4"/>
<polygon points="470.0,538.0 478.0,534.6 478.0,541.4" fill="#8a93a0"/>
<path d="M555.0,533.0 L565.0,543.0 M555.0,543.0 L565.0,533.0" stroke="#8a93a0" stroke-width="2.2" stroke-linecap="round"/>
<text x="560.0" y="556.0" font-size="10.5" fill="#56606e" text-anchor="middle">nothing of the consumer's</text>
<text x="560.0" y="569.0" font-size="10.5" fill="#56606e" text-anchor="middle">own comes back</text>
<text x="400.0" y="590.0" font-size="10.5" fill="#56606e" text-anchor="middle">Interest and the lane run as in the row above; only the publication's path is drawn.</text>
<path d="M14.0,620.0 L41.0,620.0" fill="none" stroke="#c2570f" stroke-width="1.80" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="1.5,3.5"/>
<polygon points="48.0,620.0 40.0,623.4 40.0,616.6" fill="#c2570f"/>
<text x="56.0" y="623.8" font-size="10.5" fill="#56606e" text-anchor="start">interest: UDP 8729, one hop at a time</text>
<path d="M257.5,620.0 L284.5,620.0" fill="none" stroke="#1f5fa8" stroke-width="1.80" stroke-linejoin="round" stroke-linecap="butt"/>
<polygon points="291.5,620.0 283.5,623.4 283.5,616.6" fill="#1f5fa8"/>
<text x="299.5" y="623.8" font-size="10.5" fill="#56606e" text-anchor="start">objects: delivery records, TCP</text>
<path d="M465.3,620.0 L492.3,620.0" fill="none" stroke="#14866d" stroke-width="1.80" stroke-linejoin="round" stroke-linecap="butt"/>
<polygon points="499.3,620.0 491.3,623.4 491.3,616.6" fill="#14866d"/>
<text x="507.3" y="623.8" font-size="10.5" fill="#56606e" text-anchor="start">publications: submission records, TCP</text>
</svg>
