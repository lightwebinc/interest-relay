name: CI

on:
  push:
    # main only: a branch that has a PR is already covered by the
    # pull_request run.
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    uses: lightwebinc/ci/.github/workflows/go-host.yml@5e3a118fc997d254cbc49b9bf14c4fd3ec3974d0 # v0.7.2
    with:
      # Pinned here so the toolchain moves with this repository.
      go-version: "1.27.4"
      gofmt: true
      tidy-check: true
      licences-check: true
      # Without a version the shared workflow skips its lint job.
      golangci-lint-version: v2.14.0
